[package]
name = "wed"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/cuducos/wed"

[profile.release]
lto = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
home = "0.5.12"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
notify-rust = "4.18.0"
terminal_size = "0.4.4"

[dev-dependencies]
tempdir = "0.3.7"
