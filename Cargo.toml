[package]
name = "wed"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/cuducos/wed"

[profile.release]
lto = true

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
home = "0.5.12"
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
notify-rust = "4"

[dev-dependencies]
tempdir = "0.3.7"
